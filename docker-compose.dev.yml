services:
  backend:
    container_name: trazo-backend-dev
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    init: true
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      NEXO_PORT: "5173"
    # Opcional: crea backend/.env a partir de backend/.env.example.
    # required: false permite levantar el contenedor sin ese archivo.
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "5173:5173"
    # Para usar SQL Server instalado en la máquina anfitriona:
    # DB_SERVER=host.docker.internal en backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    stdin_open: true
    tty: true

  frontend:
    container_name: trazo-frontend-dev
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    init: true
    environment:
      NODE_ENV: development
      # Hot reload con bind mounts (fiable en Windows/Docker Desktop).
      WATCHPACK_POLLING: "true"
      # El rewrite /api de Next se ejecuta dentro de este contenedor.
      API_PROXY_TARGET: "http://backend:5173"
      NEXT_PUBLIC_IMPRESION_URL: "${NEXT_PUBLIC_IMPRESION_URL:-http://172.16.21.150:3000/impresion}"
      # Hosts permitidos por el servidor de desarrollo de Next al acceder desde la LAN.
      DEV_ALLOWED_ORIGINS: "${DEV_ALLOWED_ORIGINS:-172.16.21.150}"
    ports:
      - "0.0.0.0:5174:5174"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend
    stdin_open: true
    tty: true

volumes:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:
